<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aves y Plantas">
  <title>Test Aves y Plantas (30 especies)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 12px; background: #f0f4f8; text-align: center; -webkit-tap-highlight-color: transparent; }
    .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #475569; }
    .progress-bar-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { height: 100%; background: #2563eb; width: 0%; transition: width 0.3s ease; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    h2 { margin: 2px 0 10px 0; font-size: 19px; color: #1e293b; }
    .img-box { height: 270px; display: flex; align-items: center; justify-content: center; background: #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 6px; }
    img { max-width: 100%; max-height: 270px; object-fit: contain; }
    .photo-counter { font-size: 12px; color: #64748b; margin-bottom: 10px; min-height: 16px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; font-size: 16px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { font-size: 15px; padding: 12px 14px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; }
    .nav-row { display: flex; gap: 8px; margin-top: 12px; }
    .nav-row button { flex: 1; }
    .secondary { background: #475569; }
    .warning { background: #d97706; }
    #feedback { margin-top: 10px; font-size: 16px; min-height: 24px; }
    .hint-box { font-size: 14px; color: #334155; margin-top: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid #2563eb; display: none; text-align: left; }
    #summaryScreen { display: none; padding: 20px 10px; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Barra de progreso de la sesión -->
    <div class="top-bar">
      <span id="sessionProgress">Especie 1 / 30</span>
      <span id="scoreDisplay">✅ 0 &nbsp; ❌ 0</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>

    <!-- Pantalla principal del test -->
    <div id="quizScreen">
      <div id="modeBadge" class="badge">Cargando...</div>
      <h2>¿Cómo se llama en alemán?</h2>
      <div class="img-box">
        <img id="photo" src="" alt="Cargando foto...">
      </div>
      <div id="counter" class="photo-counter"></div>
      <div class="input-row">
        <input type="text" id="answer" placeholder="Nombre en alemán..." autocomplete="off" autocorrect="off" autocapitalize="none">
        <button id="btnCheck" onclick="checkAnswer()">OK</button>
      </div>
      <div id="feedback"></div>
      <div id="hint" class="hint-box"></div>
      <div class="nav-row">
        <button id="btnMorePhoto" class="secondary" onclick="showNextPhotoOfSameSpecies()">🔄 Otra foto</button>
        <button id="btnNextSpecies" onclick="nextQuestion()">Siguiente ➡️</button>
      </div>
    </div>

    <!-- Pantalla final de resumen de la sesión -->
    <div id="summaryScreen">
      <h2 id="summaryTitle">🎉 ¡Sesión completada!</h2>
      <p id="summaryStats" style="font-size: 16px; color: #334155; margin: 16px 0;"></p>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
        <button id="btnReviewMistakes" class="warning" onclick="startMistakesSession()" style="display:none;">🔁 Repasar solo las falladas</button>
        <button onclick="startFullSession()">🔄 Empezar nueva sesión (las 30 especies)</button>
      </div>
    </div>
  </div>

<script>
const speciesList = [
  // AVES (20)
  { de: ["Turmfalke"], sci: "Falco tinnunculus", type: "bird", es: "Cernícalo vulgar", mnemo: "Espalda color ladrillo de torre (Turm) + halcón (Falke)." },
  { de: ["Waldkauz"], sci: "Strix aluco", type: "bird", es: "Cárabo común", mnemo: "Plumas de tronco de bosque (Wald) + ojos negros en el sofá/caos (Kauz)." },
  { de: ["Steinadler"], sci: "Aquila chrysaetos", type: "bird", es: "Águila real", mnemo: "Nuca rubia despeinada como Einstein / roca (Stein) + águila (Adler)." },
  { de: ["Buchfink"], sci: "Fringilla coelebs", type: "bird", es: "Pinzón vulgar", mnemo: "Páginas blancas en el ala como un libro (Buch) + canto 'fink' (Fink)." },
  { de: ["Rotmilan"], sci: "Milvus milvus", type: "bird", es: "Milano real", mnemo: "Color rojo teja (Rot) + cola en 'M' o 'V' del AC Milan (Milan)." },
  { de: ["Steinkauz"], sci: "Athene noctua", type: "bird", es: "Mochuelo europeo", mnemo: "Ojos amarillos y cejas blancas de Einstein/piedra (Stein) + rechoncho (Kauz)." },
  { de: ["Graugans"], sci: "Anser anser", type: "bird", es: "Ánsar común", mnemo: "Plumaje gris ceniza (Grau) + ganso (Gans)." },
  { de: ["Großer Brachvogel", "Grosser Brachvogel"], sci: "Numenius arquata", type: "bird", es: "Zarapito real", mnemo: "Grande/groso (Großer) + pico largo quebrado hacia abajo 'brach' (Brachvogel)." },
  { de: ["Star"], sci: "Sturnus vulgaris", type: "bird", es: "Estornino pinto", mnemo: "Plumaje oscuro lleno de puntitos blancos como estrellas y lentejuelas (Star)." },
  { de: ["Mauersegler"], sci: "Apus apus", type: "bird", es: "Vencejo común", mnemo: "Vive en muros (Mauer) + planea con alas en media luna como un velero (Segler)." },
  { de: ["Bekassine"], sci: "Gallinago gallinago", type: "bird", es: "Agachadiza común", mnemo: "Pico larguísimo y recto (Beka-) + rayas rubias largas como limusina (-ssine)." },
  { de: ["Schleiereule"], sci: "Tyto alba", type: "bird", es: "Lechuza común", mnemo: "Cara de corazón blanco como velo de novia (Schleier) + lechuza (Eule)." },
  { de: ["Mäusebussard"], sci: "Buteo buteo", type: "bird", es: "Busardo ratonero", mnemo: "Babero blanco para comer ratones (Mäuse) + cuerpo ancho como un autobús (Bussard)." },
  { de: ["Uhu"], sci: "Bubo bubo", type: "bird", es: "Búho real", mnemo: "Dos penachos en forma de 'U' + ojos naranja fuego que asustan: '¡Uhu!'." },
  { de: ["Saatkrähe"], sci: "Corvus frugilegus", type: "bird", es: "Graja", mnemo: "Base del pico blanca por meterla en el saco de semillas (Saat) + cuervo (Krähe)." },
  { de: ["Eichelhäher"], sci: "Garrulus glandarius", type: "bird", es: "Arrendajo", mnemo: "Come bellotas (Eichel) con parche azul + bigote que se ríe '¡jé-er!' (Häher)." },
  { de: ["Feldlerche"], sci: "Alauda arvensis", type: "bird", es: "Alondra común", mnemo: "Pajarito con tupé en la tierra del campo (Feld) y pecho claro manchado como de leche (Lerche)." },
  { de: ["Gebirgsstelze"], sci: "Motacilla cinerea", type: "bird", es: "Lavandera cascadeña", mnemo: "Barriga amarilla y espalda gris sobre rocas de río de montaña (Gebirgs-) + cola larga y patas muy esbeltas como zancos (Stelze)." },
  { de: ["Bachstelze"], sci: "Motacilla alba", type: "bird", es: "Lavandera blanca", mnemo: "Traje blanco y negro con babero como el músico J. S. Bach junto al arroyo (Bach) + patas esbeltas como zancos (Stelze)." },
  { de: ["Hausrotschwanz"], sci: "Phoenicurus ochruros", type: "bird", es: "Colirrojo tizón", mnemo: "Gris oscuro como hollín de chimenea de casa (Haus) + cola (Schwanz) de color rojo teja (rot)." },

  // PLANTAS (10)
  { de: ["Schlehe", "Schwarzdorn"], sci: "Prunus spinosa", type: "plant", es: "Endrino", mnemo: "Ramas con espinas y bayas azules escarchadas de nieve (Schnee -> Schlehe)." },
  { de: ["Gemeiner Liguster", "Liguster"], sci: "Ligustrum vulgare", type: "plant", es: "Aligustre común", mnemo: "Bayas negras como gemas venenosas (Gemeiner) + hojas ligadas en parejas (Liguster)." },
  { de: ["Roter Holunder", "Traubenholunder"], sci: "Sambucus racemosa", type: "plant", es: "Saúco rojo", mnemo: "Racimo cónico rojo (Roter) que dice '¡Hola!' debajo de las hojas (Holunder)." },
  { de: ["Wolliger Schneeball"], sci: "Viburnum lantana", type: "plant", es: "Barbadejo / Lantana", mnemo: "Hojas arrugadas de lana (Wolliger) + bayas rojas y negras a la vez (Schneeball)." },
  { de: ["Zitterpappel", "Zitter-Pappel", "Espe"], sci: "Populus tremula", type: "plant", onlyLeaves: true, es: "Álamo temblón", mnemo: "Hojas redondas de papel (Pappel) con rabillo largo que tiritan con la brisa (Zitter)." },
  { de: ["Schwarz-Erle", "Schwarzerle"], sci: "Alnus glutinosa", type: "plant", es: "Aliso común", mnemo: "Piñitas negras (Schwarz) que cuelgan como perlas y hoja con punta mordida (Erle)." },
  { de: ["Hainbuche", "Weißbuche", "Weissbuche"], sci: "Carpinus betulus", type: "plant", es: "Carpe común", mnemo: "Hoja plegada como libro (Buche) con dientes afilados de tiburón / Hai (Hainbuche)." },
  { de: ["Gemeine Heckenkirsche", "Rote Heckenkirsche", "Heckenkirsche"], sci: "Lonicera xylosteum", type: "plant", es: "Madreselva pilosa / Cerezo de seto", mnemo: "Bayas rojas venenosas (Gemeine) de 2 en 2 haciendo eco en el seto (Hecken) como cerezas (Kirsche)." },
  { de: ["Roter Hartriegel", "Blutroter Hartriegel", "Hartriegel"], sci: "Cornus sanguinea", type: "plant", es: "Cornejo común / Sanguino", mnemo: "Ramas y hojas con tonos rojo sangre (Roter) + ramillete plano de bayas negras y hojas con nervios curvos como rieles duros (Hartriegel)." },
  { de: ["Mistel", "Weißbeerige Mistel", "Weissbeerige Mistel"], sci: "Viscum album", type: "plant", winterFruit: true, es: "Muérdago blanco", mnemo: "Bayas blancas como perlas y hojas en 'V' que crecen en las ramas de forma mística / por excrementos de ave (Mist -> Mistel)." }
];

let sessionDeck = [];
let mistakesDeck = [];
let deckIndex = -1;
let currentSpecies = null;
let currentQuestionAnswered = false;
let correctCount = 0;
let wrongCount = 0;

let photoPool = [];
let currentPhotoIndex = 0;
let activeRequestId = 0;
const taxonCache = {};

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startFullSession() {
  sessionDeck = shuffleArray(speciesList);
  mistakesDeck = [];
  deckIndex = -1;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById("summaryScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  nextQuestion();
}

function startMistakesSession() {
  sessionDeck = shuffleArray(mistakesDeck);
  mistakesDeck = [];
  deckIndex = -1;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById("summaryScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  nextQuestion();
}

function updateTopBar() {
  const total = sessionDeck.length;
  const currentNum = Math.min(deckIndex + 1, total);
  document.getElementById("sessionProgress").textContent = `Especie ${currentNum} / ${total}`;
  document.getElementById("scoreDisplay").innerHTML = `✅ ${correctCount} &nbsp; ❌ ${wrongCount}`;
  const pct = total > 0 ? (currentNum / total) * 100 : 0;
  document.getElementById("progressBar").style.width = `${pct}%`;
}

function extractValidPhotos(obsResults, sciName) {
  const urls = [];
  for (const obs of obsResults) {
    if (obs.taxon && obs.taxon.name.toLowerCase().startsWith(sciName.toLowerCase()) && obs.photos) {
      for (const p of obs.photos.slice(0, 2)) {
        if (p.url) urls.push(p.url.replace("square", "medium"));
      }
    }
  }
  return [...new Set(urls)];
}

async function fetchPhotosForSpecies(speciesObj) {
  const sciName = speciesObj.sci;
  if (taxonCache[sciName]) return shuffleArray(taxonCache[sciName]);

  const taxonRes = await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(sciName)}&rank=species`);
  const taxonData = await taxonRes.json();
  const exactTaxon = taxonData.results.find(t => t.name.toLowerCase() === sciName.toLowerCase()) || taxonData.results[0];

  let urls = [];
  if (speciesObj.type === "plant") {
    if (!speciesObj.onlyLeaves) {
      const months = speciesObj.winterFruit ? "1,2,3,9,10,11,12" : "6,7,8,9,10";
      const fruitRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&term_id=12&term_value_id=14&month=${months}&per_page=40&order_by=votes`);
      const fruitData = await fruitRes.json();
      urls = extractValidPhotos(fruitData.results, sciName);
    }
    if (urls.length < 15) {
      const fallbackMonths = speciesObj.winterFruit ? "11,12,1,2" : "7,8,9";
      const leavesRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&month=${fallbackMonths}&per_page=40&order_by=votes`);
      const leavesData = await leavesRes.json();
      urls = [...new Set([...urls, ...extractValidPhotos(leavesData.results, sciName)])];
    }
  } else {
    const birdRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&per_page=40&order_by=votes`);
    const birdData = await birdRes.json();
    urls = extractValidPhotos(birdData.results, sciName);
  }
  taxonCache[sciName] = urls;
  return shuffleArray(urls);
}

async function nextQuestion() {
  if (deckIndex >= 0 && !currentQuestionAnswered && currentSpecies) {
    wrongCount++;
    if (!mistakesDeck.some(s => s.sci === currentSpecies.sci)) {
      mistakesDeck.push(currentSpecies);
    }
  }

  deckIndex++;

  if (deckIndex >= sessionDeck.length) {
    showSessionSummary();
    return;
  }

  currentSpecies = sessionDeck[deckIndex];
  currentQuestionAnswered = false;
  updateTopBar();

  const requestId = ++activeRequestId;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("hint").style.display = "none";
  document.getElementById("answer").value = "";
  document.getElementById("photo").src = "";
  document.getElementById("counter").textContent = "Cargando galería...";
  document.getElementById("btnMorePhoto").disabled = true;

  const badge = document.getElementById("modeBadge");
  if (currentSpecies.type === "plant") {
    badge.textContent = "🌿 Planta (Hojas y frutos)";
    badge.style.background = "#dcfce7"; badge.style.color = "#166534";
  } else {
    badge.textContent = "🦅 Ave";
    badge.style.background = "#dbeafe"; badge.style.color = "#1e40af";
  }

  try {
    const photos = await fetchPhotosForSpecies(currentSpecies);
    if (requestId !== activeRequestId) return;
    photoPool = photos; currentPhotoIndex = 0;
    document.getElementById("btnMorePhoto").disabled = false;
    displayCurrentPhoto();
  } catch (e) {
    if (requestId !== activeRequestId) return;
    document.getElementById("counter").textContent = "Error de conexión.";
  }
}

function showSessionSummary() {
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("summaryScreen").style.display = "block";
  const total = sessionDeck.length;
  document.getElementById("summaryStats").innerHTML = 
    `Has acertado <strong>${correctCount}</strong> de <strong>${total}</strong> especies.<br>` +
    (mistakesDeck.length > 0 
      ? `Tienes <strong>${mistakesDeck.length}</strong> especie(s) pendiente(s) de dominar.` 
      : `¡Enhorabuena! Has dominado todas las especies de esta ronda sin un solo fallo.`);

  const btnMistakes = document.getElementById("btnReviewMistakes");
  if (mistakesDeck.length > 0) {
    btnMistakes.style.display = "block";
    btnMistakes.textContent = `🔁 Repasar las ${mistakesDeck.length} falladas / saltadas`;
  } else {
    btnMistakes.style.display = "none";
  }
}

function displayCurrentPhoto() {
  if (photoPool.length > 0) {
    document.getElementById("photo").src = photoPool[currentPhotoIndex];
    document.getElementById("counter").textContent = `Foto ${currentPhotoIndex + 1} de ${photoPool.length} de esta especie`;
  }
}

function showNextPhotoOfSameSpecies() {
  if (photoPool.length > 1) {
    currentPhotoIndex = (currentPhotoIndex + 1) % photoPool.length;
    displayCurrentPhoto();
  }
}

function checkAnswer() {
  if (!currentSpecies) return;
  const userAns = document.getElementById("answer").value.trim().toLowerCase();
  const isCorrect = currentSpecies.de.some(ans => ans.toLowerCase() === userAns);
  const fb = document.getElementById("feedback");
  const hint = document.getElementById("hint");

  if (!currentQuestionAnswered) {
    currentQuestionAnswered = true;
    if (isCorrect) {
      correctCount++;
    } else {
      wrongCount++;
      if (!mistakesDeck.some(s => s.sci === currentSpecies.sci)) {
        mistakesDeck.push(currentSpecies);
      }
    }
    updateTopBar();
  }

  fb.innerHTML = isCorrect 
    ? `<span style="color:#16a34a; font-weight:bold;">✅ ¡Correcto! ${currentSpecies.de[0]} (${currentSpecies.es})</span>`
    : `<span style="color:#dc2626; font-weight:bold;">❌ Era: ${currentSpecies.de[0]} (${currentSpecies.es})</span>`;
  hint.innerHTML = `<strong>💡 Truco visual:</strong> ${currentSpecies.mnemo}`;
  hint.style.display = "block";
}

document.getElementById("answer").addEventListener("keypress", function(e) {
  if (e.key === "Enter") { checkAnswer(); this.blur(); }
});

startFullSession();
</script>
</body>
</html>

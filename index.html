<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aves y Plantas">
  <title>Aves y Plantas: Test & Estudio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: #f0f4f8; text-align: center; -webkit-tap-highlight-color: transparent; }
    .card { background: white; padding: 16px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 650px; margin: 0 auto; text-align: left; }
    
    .tab-header { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .tab-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: 700; border: none; background: #f1f5f9; color: #64748b; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #2563eb; color: white; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #475569; }
    .progress-bar-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { height: 100%; background: #2563eb; width: 0%; transition: width 0.3s ease; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    h2 { margin: 2px 0 10px 0; font-size: 19px; color: #1e293b; text-align: center; }
    .img-box { height: 270px; display: flex; align-items: center; justify-content: center; background: #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 6px; }
    img.quiz-img { max-width: 100%; max-height: 270px; object-fit: contain; }
    .photo-counter { font-size: 12px; color: #64748b; margin-bottom: 10px; min-height: 16px; text-align: center; }
    .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; font-size: 16px; padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; }
    input:focus { border-color: #2563eb; }
    button.action-btn { font-size: 15px; padding: 12px 14px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; }
    .nav-row { display: flex; gap: 8px; margin-top: 12px; }
    .nav-row button { flex: 1; }
    .secondary { background: #475569; }
    .warning { background: #d97706; }
    #feedback { margin-top: 10px; font-size: 16px; min-height: 24px; text-align: center; }
    .hint-box { font-size: 14px; color: #334155; margin-top: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid #2563eb; display: none; }
    #summaryScreen { display: none; padding: 20px 10px; text-align: center; }

    .study-group { margin-bottom: 24px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
    .group-title { font-size: 16px; font-weight: 700; color: #1e293b; margin: 0 0 10px 0; display: flex; align-items: center; justify-content: space-between; }
    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.comp-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    table.comp-table th { background: #e2e8f0; padding: 8px; font-weight: 700; color: #334155; border: 1px solid #cbd5e1; }
    table.comp-table td { padding: 8px; border: 1px solid #e2e8f0; background: white; vertical-align: middle; }
    
    .img-thumb-container { position: relative; width: 72px; height: 72px; cursor: pointer; border-radius: 8px; overflow: hidden; background: #cbd5e1; flex-shrink: 0; }
    .cell-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .img-thumb-container:hover .cell-img { transform: scale(1.08); }
    .zoom-hint { position: absolute; right: 3px; bottom: 3px; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; font-size: 10px; padding: 1px 3px; pointer-events: none; }
    
    .species-de { font-weight: 700; color: #0f172a; font-size: 14px; }
    .species-es { color: #64748b; font-size: 12px; }
    .diff-trait { color: #0369a1; font-weight: 600; line-height: 1.35; }

    .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.90); flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { max-width: 95%; max-height: 75vh; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-caption { color: white; margin-top: 12px; font-size: 15px; font-weight: 600; text-align: center; max-width: 90%; }
    .modal-close { position: absolute; top: 16px; right: 20px; color: white; font-size: 32px; font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.4); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tab-header">
      <button id="tabQuizBtn" class="tab-btn active" onclick="switchTab('quiz')">🎯 Test</button>
      <button id="tabStudyBtn" class="tab-btn" onclick="switchTab('study')">📚 Repaso Comparativo</button>
    </div>

    <!-- PESTAÑA 1: TEST -->
    <div id="tabQuiz">
      <div class="top-bar">
        <span id="sessionProgress">Especie 1 / 36</span>
        <span id="scoreDisplay">✅ 0 &nbsp; ❌ 0</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>

      <div id="quizScreen">
        <div style="text-align: center;"><div id="modeBadge" class="badge">Cargando...</div></div>
        <h2>¿Cómo se llama en alemán?</h2>
        <div class="img-box">
          <img id="photo" class="quiz-img" src="" alt="Cargando foto...">
        </div>
        <div id="counter" class="photo-counter"></div>
        <div class="input-row">
          <input type="text" id="answer" placeholder="Nombre en alemán..." autocomplete="off" autocorrect="off" autocapitalize="none">
          <button id="btnCheck" class="action-btn" onclick="checkAnswer()">OK</button>
        </div>
        <div id="feedback"></div>
        <div id="hint" class="hint-box"></div>
        <div class="nav-row">
          <button id="btnMorePhoto" class="action-btn secondary" onclick="showNextPhotoOfSameSpecies()">🔄 Otra foto</button>
          <button id="btnNextSpecies" class="action-btn" onclick="nextQuestion()">Siguiente ➡️</button>
        </div>
      </div>

      <div id="summaryScreen">
        <h2 id="summaryTitle">🎉 ¡Sesión completada!</h2>
        <p id="summaryStats" style="font-size: 16px; color: #334155; margin: 16px 0;"></p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
          <button id="btnReviewMistakes" class="action-btn warning" onclick="startMistakesSession()" style="display:none;">🔁 Repasar solo las falladas</button>
          <button class="action-btn" onclick="startFullSession()">🔄 Empezar nueva sesión (las 36 especies)</button>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: REPASO COMPARATIVO -->
    <div id="tabStudy" style="display: none;">
      <p style="font-size: 13px; color: #64748b; margin-top: 0; line-height: 1.4;">
        Toca cualquier foto fija para <strong>ampliarla a pantalla completa</strong> y estudiar el rasgo morfológico clave.
      </p>
      <div id="studyContent"></div>
    </div>
  </div>

  <div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <img id="modalImg" class="modal-content" src="" alt="Zoom">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

function switchTab(tab) {
  const quizTab = document.getElementById("tabQuiz");
  const studyTab = document.getElementById("tabStudy");
  const btnQuiz = document.getElementById("tabQuizBtn");
  const btnStudy = document.getElementById("tabStudyBtn");

  if (tab === "quiz") {
    quizTab.style.display = "block";
    studyTab.style.display = "none";
    btnQuiz.classList.add("active");
    btnStudy.classList.remove("active");
  } else {
    quizTab.style.display = "none";
    studyTab.style.display = "block";
    btnQuiz.classList.remove("active");
    btnStudy.classList.add("active");
    renderStudySection();
  }
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startFullSession() {
  sessionDeck = shuffleArray(speciesList);
  mistakesDeck = [];
  deckIndex = -1;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById("summaryScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  nextQuestion();
}

function startMistakesSession() {
  sessionDeck = shuffleArray(mistakesDeck);
  mistakesDeck = [];
  deckIndex = -1;
  correctCount = 0;
  wrongCount = 0;
  document.getElementById("summaryScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  nextQuestion();
}

function updateTopBar() {
  const total = sessionDeck.length;
  const currentNum = Math.min(deckIndex + 1, total);
  document.getElementById("sessionProgress").textContent = `Especie ${currentNum} / ${total}`;
  document.getElementById("scoreDisplay").innerHTML = `✅ ${correctCount} &nbsp; ❌ ${wrongCount}`;
  const pct = total > 0 ? (currentNum / total) * 100 : 0;
  document.getElementById("progressBar").style.width = `${pct}%`;
}

function extractValidPhotos(obsResults, sciName) {
  const urls = [];
  for (const obs of obsResults) {
    if (obs.taxon && obs.taxon.name.toLowerCase().startsWith(sciName.toLowerCase()) && obs.photos) {
      for (const p of obs.photos.slice(0, 2)) {
        if (p.url) urls.push(p.url.replace("square", "medium"));
      }
    }
  }
  return [...new Set(urls)];
}

async function fetchPhotosForSpecies(speciesObj) {
  const sciName = speciesObj.sci;
  if (taxonCache[sciName]) return shuffleArray(taxonCache[sciName]);

  const taxonRes = await fetch(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(sciName)}&rank=species`);
  const taxonData = await taxonRes.json();
  const exactTaxon = taxonData.results.find(t => t.name.toLowerCase() === sciName.toLowerCase()) || taxonData.results[0];

  let urls = [];
  if (speciesObj.type === "plant") {
    if (!speciesObj.onlyLeaves) {
      const months = speciesObj.winterFruit ? "1,2,3,9,10,11,12" : "6,7,8,9,10";
      const fruitRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&term_id=12&term_value_id=14&month=${months}&per_page=40&order_by=votes`);
      const fruitData = await fruitRes.json();
      urls = extractValidPhotos(fruitData.results, sciName);
    }
    if (urls.length < 15) {
      const fallbackMonths = speciesObj.winterFruit ? "11,12,1,2" : "7,8,9";
      const leavesRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&month=${fallbackMonths}&per_page=40&order_by=votes`);
      const leavesData = await leavesRes.json();
      urls = [...new Set([...urls, ...extractValidPhotos(leavesData.results, sciName)])];
    }
  } else {
    const birdRes = await fetch(`https://api.inaturalist.org/v1/observations?taxon_id=${exactTaxon.id}&quality_grade=research&photos=true&per_page=40&order_by=votes`);
    const birdData = await birdRes.json();
    urls = extractValidPhotos(birdData.results, sciName);
  }
  taxonCache[sciName] = urls;
  return shuffleArray(urls);
}

async function nextQuestion() {
  if (deckIndex >= 0 && !currentQuestionAnswered && currentSpecies) {
    wrongCount++;
    if (!mistakesDeck.some(s => s.sci === currentSpecies.sci)) {
      mistakesDeck.push(currentSpecies);
    }
  }

  deckIndex++;

  if (deckIndex >= sessionDeck.length) {
    showSessionSummary();
    return;
  }

  currentSpecies = sessionDeck[deckIndex];
  currentQuestionAnswered = false;
  updateTopBar();

  const requestId = ++activeRequestId;
  document.getElementById("feedback").innerHTML = "";
  document.getElementById("hint").style.display = "none";
  document.getElementById("answer").value = "";
  document.getElementById("photo").src = "";
  document.getElementById("counter").textContent = "Cargando galería...";
  document.getElementById("btnMorePhoto").disabled = true;

  const badge = document.getElementById("modeBadge");
  if (currentSpecies.type === "plant") {
    badge.textContent = `🌿 ${currentSpecies.group}`;
    badge.style.background = "#dcfce7"; badge.style.color = "#166534";
  } else {
    badge.textContent = `🦅 ${currentSpecies.group}`;
    badge.style.background = "#dbeafe"; badge.style.color = "#1e40af";
  }

  try {
    const photos = await fetchPhotosForSpecies(currentSpecies);
    if (requestId !== activeRequestId) return;
    photoPool = photos; currentPhotoIndex = 0;
    document.getElementById("btnMorePhoto").disabled = false;
    displayCurrentPhoto();
  } catch (e) {
    if (requestId !== activeRequestId) return;
    document.getElementById("counter").textContent = "Error de conexión.";
  }
}

function showSessionSummary() {
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("summaryScreen").style.display = "block";
  const total = sessionDeck.length;
  document.getElementById("summaryStats").innerHTML = 
    `Has acertado <strong>${correctCount}</strong> de <strong>${total}</strong> especies.<br>` +
    (mistakesDeck.length > 0 
      ? `Tienes <strong>${mistakesDeck.length}</strong> especie(s) pendiente(s) de dominar.` 
      : `¡Enhorabuena! Has dominado todas las especies de esta ronda.`);

  const btnMistakes = document.getElementById("btnReviewMistakes");
  if (mistakesDeck.length > 0) {
    btnMistakes.style.display = "block";
    btnMistakes.textContent = `🔁 Repasar las ${mistakesDeck.length} falladas / saltadas`;
  } else {
    btnMistakes.style.display = "none";
  }
}

function displayCurrentPhoto() {
  if (photoPool.length > 0) {
    document.getElementById("photo").src = photoPool[currentPhotoIndex];
    document.getElementById("counter").textContent = `Foto ${currentPhotoIndex + 1} de ${photoPool.length} de esta especie`;
  }
}

function showNextPhotoOfSameSpecies() {
  if (photoPool.length > 1) {
    currentPhotoIndex = (currentPhotoIndex + 1) % photoPool.length;
    displayCurrentPhoto();
  }
}

function checkAnswer() {
  if (!currentSpecies) return;
  const userAns = document.getElementById("answer").value.trim().toLowerCase();
  const isCorrect = currentSpecies.de.some(ans => ans.toLowerCase() === userAns);
  const fb = document.getElementById("feedback");
  const hint = document.getElementById("hint");

  if (!currentQuestionAnswered) {
    currentQuestionAnswered = true;
    if (isCorrect) {
      correctCount++;
    } else {
      wrongCount++;
      if (!mistakesDeck.some(s => s.sci === currentSpecies.sci)) {
        mistakesDeck.push(currentSpecies);
      }
    }
    updateTopBar();
  }

  fb.innerHTML = isCorrect 
    ? `<span style="color:#16a34a; font-weight:bold;">✅ ¡Correcto! ${currentSpecies.de[0]} (${currentSpecies.es})</span>`
    : `<span style="color:#dc2626; font-weight:bold;">❌ Era: ${currentSpecies.de[0]} (${currentSpecies.es})</span>`;
  hint.innerHTML = `<strong>💡 Clave:</strong> ${currentSpecies.trait}<br><span style="font-size:12px; color:#64748b;">(Truco: ${currentSpecies.mnemo})</span>`;
  hint.style.display = "block";
}

document.getElementById("answer").addEventListener("keypress", function(e) {
  if (e.key === "Enter") { checkAnswer(); this.blur(); }
});

function openModal(imgSrc, title, desc) {
  if (!imgSrc) return;
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImg");
  const caption = document.getElementById("modalCaption");
  
  modalImg.src = imgSrc;
  caption.innerHTML = `${title}<br><span style="font-size:13px; font-weight:normal; color:#cbd5e1;">${desc}</span>`;
  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}

// Respaldo dinámico: si no has subido todavía el archivo local, consulta la foto en línea
function handleFixedImgError(imgElement, sciName) {
  const sp = speciesList.find(s => s.sci === sciName);
  if (!sp) return;
  fetchPhotosForSpecies(sp).then(urls => {
    if (urls && urls.length > 0) {
      imgElement.src = urls[0];
      const parentThumb = imgElement.closest('.img-thumb-container');
      if (parentThumb) {
        parentThumb.onclick = () => openModal(urls[0], `${sp.de[0]} (${sp.es})`, sp.trait);
      }
    }
  });
}

let studyRendered = false;
function renderStudySection() {
  if (studyRendered) return;
  studyRendered = true;
  const container = document.getElementById("studyContent");

  const groups = [...new Set(speciesList.map(s => s.group))];

  groups.forEach(groupName => {
    const groupItems = speciesList.filter(s => s.group === groupName);
    const box = document.createElement("div");
    box.className = "study-group";

    let rowsHtml = "";
    groupItems.forEach((sp) => {
      const escapedDe = sp.de[0].replace(/'/g, "\\'");
      const escapedEs = sp.es.replace(/'/g, "\\'");
      const escapedTrait = sp.trait.replace(/'/g, "\\'");

      rowsHtml += `
        <tr>
          <td style="width: 76px; text-align: center;">
            <div class="img-thumb-container" onclick="openModal('${sp.fixedImg}', '${escapedDe} (${escapedEs})', '${escapedTrait}')">
              <img class="cell-img" src="${sp.fixedImg}" alt="${sp.de[0]}" loading="lazy" onerror="handleFixedImgError(this, '${sp.sci}')">
              <span class="zoom-hint">🔍</span>
            </div>
          </td>
          <td style="width: 32%;">
            <div class="species-de">${sp.de[0]}</div>
            <div class="species-es">${sp.es}</div>
            <div style="font-size:11px; color:#94a3b8; font-style:italic;">${sp.sci}</div>
          </td>
          <td>
            <div class="diff-trait">${sp.trait}</div>
            <div style="font-size: 11px; color: #64748b; margin-top: 4px;">🧠 ${sp.mnemo}</div>
          </td>
        </tr>
      `;
    });

    box.innerHTML = `
      <div class="group-title">
        <span>${groupName.startsWith("Otras") ? "📌 " : "🔍 "}${groupName}</span>
        <span style="font-size:12px; color:#64748b; font-weight:normal;">(${groupItems.length} especies)</span>
      </div>
      <div class="table-container">
        <table class="comp-table">
          <thead>
            <tr>
              <th>Foto fija</th>
              <th>Especie</th>
              <th>Rasgo Clave Diferenciador</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </div>
    `;
    container.appendChild(box);
  });
}

startFullSession();
</script>
</body>
</html>

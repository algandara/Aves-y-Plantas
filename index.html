<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <div class="card">
    <div class="menu-header">
      <h1>Estudio 📚</h1>
      <p>¿Qué quieres estudiar hoy?</p>
    </div>

    <div class="menu-options">
      <!-- TEMA: AVES Y PLANTAS -->
      <a class="mode-card card-tema-aves" href="app.html?tema=aves-y-plantas">
        <div class="card-top-tag">TEMA ACTIVO</div>
        <div class="card-main-content">
          <div class="card-huge-icon">🦅🌿</div>
          <div class="card-headings">
            <h2>Aves y plantas</h2>
            <p>Aves, árboles y arbustos alemanes: examen, juegos, repaso y estadísticas.</p>
          </div>
        </div>
        <div class="card-action-bar">
          <span>Estudiar</span>
          <span class="action-arrow">➔</span>
        </div>
      </a>

      <!-- TEMA: CUERPO HUMANO (pendiente de contenido) -->
      <div class="mode-card card-tema-cuerpo disabled">
        <div class="card-top-tag">PRÓXIMAMENTE</div>
        <div class="card-main-content">
          <div class="card-huge-icon">🫀</div>
          <div class="card-headings">
            <h2>Cuerpo humano</h2>
            <p>Partes del cuerpo en alemán. Todavía en preparación.</p>
          </div>
        </div>
        <div class="card-action-bar">
          <span>Todavía no disponible</span>
        </div>

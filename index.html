<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aves y Plantas">
  <title>Aves y Plantas: Test & Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <!-- Pestañas de navegación -->
    <div class="tab-header">
      <button id="tabQuizBtn" class="tab-btn active" onclick="switchTab('quiz')">🎯 Test</button>
      <button id="tabStudyBtn" class="tab-btn" onclick="switchTab('study')">📚 Repaso Comparativo</button>
    </div>

    <!-- PESTAÑA 1: TEST -->
    <div id="tabQuiz">
      <div class="top-bar">
        <span id="sessionProgress">Especie 1 / 36</span>
        <span id="scoreDisplay">✅ 0 &nbsp; ❌ 0</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>

      <div id="quizScreen">
        <div style="text-align: center;"><div id="modeBadge" class="badge">Cargando...</div></div>
        <h2>¿Cómo se llama en alemán?</h2>
        <div class="img-box">
          <img id="photo" class="quiz-img" src="" alt="Cargando foto...">
        </div>
        <div id="counter" class="photo-counter"></div>
        <div class="input-row">
          <input type="text" id="answer" placeholder="Nombre en alemán..." autocomplete="off" autocorrect="off" autocapitalize="none">
          <button id="btnCheck" class="action-btn" onclick="checkAnswer()">OK</button>
        </div>
        <div id="feedback"></div>
        <div id="hint" class="hint-box"></div>
        <div class="nav-row">
          <button id="btnMorePhoto" class="action-btn secondary" onclick="showNextPhotoOfSameSpecies()">🔄 Otra foto</button>
          <button id="btnNextSpecies" class="action-btn" onclick="nextQuestion()">Siguiente ➡️</button>
        </div>
      </div>

      <div id="summaryScreen">
        <h2 id="summaryTitle">🎉 ¡Sesión completada!</h2>
        <p id="summaryStats" style="font-size: 16px; color: #334155; margin: 16px 0;"></p>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
          <button id="btnReviewMistakes" class="action-btn warning" onclick="startMistakesSession()" style="display:none;">🔁 Repasar solo las falladas</button>
          <button class="action-btn" onclick="startFullSession()">🔄 Empezar nueva sesión (las 36 especies)</button>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: REPASO COMPARATIVO -->
    <div id="tabStudy" style="display: none;">
      <p style="font-size: 13px; color: #64748b; margin-top: 0; line-height: 1.4;">
        Toca cualquier foto fija para <strong>ampliarla a pantalla completa</strong> y estudiar el rasgo morfológico clave.
      </p>
      <div id="studyContent"></div>
    </div>
  </div>

  <!-- Visor Modal a Pantalla Completa -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <div class="modal-close" onclick="closeModal()">&times;</div>
    <img id="modalImg" class="modal-content" src="" alt="Zoom">
    <div id="modalCaption" class="modal-caption"></div>
  </div>

  <!-- Carga modular de datos y lógica -->
  <script src="data.js"></script>
  <script src="test.js"></script>
  <script src="study.js"></script>
  <script>
    function switchTab(tab) {
      const quizTab = document.getElementById("tabQuiz");
      const studyTab = document.getElementById("tabStudy");
      const btnQuiz = document.getElementById("tabQuizBtn");
      const btnStudy = document.getElementById("tabStudyBtn");

      if (tab === "quiz") {
        quizTab.style.display = "block";
        studyTab.style.display = "none";
        btnQuiz.classList.add("active");
        btnStudy.classList.remove("active");
      } else {
        quizTab.style.display = "none";
        studyTab.style.display = "block";
        btnQuiz.classList.remove("active");
        btnStudy.classList.add("active");
        renderStudySection();
      }
    }

    // Inicializar test
    startFullSession();
  </script>
</body>
</html>
